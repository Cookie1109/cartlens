spring.application.name=cartlens-backend
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
cartlens.cors.allowed-origin=${CARTLENS_CORS_ALLOWED_ORIGIN:http://localhost:5173}
cartlens.archive-path=${CARTLENS_ARCHIVE_PATH:./data/cartlens}
cartlens.dataset-root=${CARTLENS_DATASET_ROOT:}
spring.jackson.deserialization.accept-float-as-int=false
